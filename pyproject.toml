[project]
name = "openshokz"
version = "0.1.0"
description = "Open-source configuration tool for Shokz Bluetooth headsets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.13",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "ruff>=0.17",
    "pre-commit>=4.0",
]

[project.scripts]
openshokz = "openshokz.cli:main"
openshokz-app = "openshokz.app:main"
shokz-probe = "scripts.probe_model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openshokz" = ["models/*.yaml", "data/*.desktop"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "C9",  # complexity
    "SIM",
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["openshokz.ui.*", "openshokz.app", "openshokz.cli"]
ignore_errors = true

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingModuleSource = false
ignore = ["src/openshokz/ui", "src/openshokz/app.py", "src/openshokz/cli.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
