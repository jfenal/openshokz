name: "OpenComm2 2025 USB-C"
firmware_prefix: "HC_HU"

# Shokz/AfterShokz OUI prefixes used to auto-detect headsets during BT scan
oui_prefixes:
  - "a0:0c:e2"

bluetooth:
  rfcomm_channel: 14  # DLCI 0x1d / 2 = server channel 14

battery:
  command: 0x03
  # Response: byte 0=status, byte 1=level (0–scale), byte 2=unknown, byte 3=pad
  # Percentage formula: min(100, (level+1) * 100//(scale+1)) → 10% steps
  # level 0→10%, 1→20%, ..., 3→40%, ..., 9→100%
  scale: 9

eq:
  command: 0x0e
  preset_id_byte: 0          # payload byte index holding the preset ID
  band_bytes: [1, 2, 3, 4, 5, 6, 7]  # payload byte indices for signed-int8 EQ bands
  # Estimated frequency centres (Hz) — unconfirmed, need a 3rd preset to calibrate
  band_frequencies: [250, 500, 1000, 2000, 4000, 6000, 8000]
  presets:
    standard:
      id: 0x01
      bands: [0, 0, 0, 0, 0, 0, 0]
      label: "Standard"
    vocal:
      id: 0x02
      bands: [-4, 0, 3, 2, 2, 0, 0]
      label: "Vocal Booster"
  # Only preset IDs 0x01 and 0x02 accepted by this firmware.
  # Custom bands must be sent with an existing preset ID; the headset applies
  # the provided band values directly via its DSP regardless of the ID label.
  custom_preset_id: 0x01  # ID to use when sending arbitrary band values

language:
  command: 0x02
  # Write: payload = LE uint32 language code; response echoes the code.
  # A trailing write of code 0x00 acts as commit after setting all slots.
  codes:
    en: 0x00
    zh: 0x01
    ja: 0x02
    ko: 0x03

device_info:
  command: 0x04
  # Response layout: byte 0=status, byte 1=count, byte 2=pad,
  # then per-device: 6B MAC + 1B active + 1B name_len + name_len B name + 1B null

multipoint:
  add_command: 0x0b    # write 6-byte MAC to connect that device as 2nd endpoint
  primary_command: 0x10  # write 6-byte MAC to set primary, deactivating others

# Commands observed but purpose not fully determined
unknown_commands:
  - command: 0x06
    note: "connection status read; always returns 00000000"
  - command: 0x08
    note: "link state read; returns 0001000000000000 when connected"
  - command: 0x11
    note: "unknown read; always returns 00000000"
