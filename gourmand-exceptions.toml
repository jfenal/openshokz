[[exceptions]]
check = "EV010-single_use_helpers"
path = "gnome-extension/subprocess.js"
line = 8
classification = "by_design"
justification = "runAsync is exported and used by both subprocess.js (via fetchBattery) and presetMenu.js directly — Gourmand's cross-file analysis may not detect the second caller in the GJS module graph"

[[exceptions]]
check = "CH022-pub_visibility"
path = "gnome-extension/extension.js"
