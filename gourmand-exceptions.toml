# Gourmand exceptions — baseline violations with by_design justifications
# Remove entries as violations are genuinely fixed.


[[exceptions]]
check = "CH009-random_scripts"
path = "shokz_config.py"
classification = "by_design"
justification = "shokz_config.py is the project's primary CLI entry point — root placement is intentional project structure alongside models/ and protocol.py"

[[exceptions]]
check = "CH006-primitive_obsession"
path = "scripts/probe_model.py"
item = "_write_template"
classification = "by_design"
justification = "max_battery_level = 15 names the magic number; Gourmand fires on the RHS literal even when the value is already named by a local constant"

[[exceptions]]
check = "CH006-primitive_obsession"
path = "shokz_config.py"
item = "cmd_eq"
classification = "by_design"
justification = "byte_mask = 0xFF names the magic number; Gourmand fires on the RHS literal even when the value is already named by a local constant"

[[exceptions]]
check = "EV004-redundant_error_handling"
path = "scripts/send_cmd.py"
item = "main"
classification = "by_design"
justification = "send_cmd.py is a developer diagnostic tool; printing the error before exit is the correct UX for a CLI debug script"

[[exceptions]]
check = "CH020-direct_exit"
path = "scripts/probe_model.py"
item = "main"
classification = "by_design"
justification = "sys.exit() in main() of a CLI entry-point script is correct Python; probe_model.py is not a library"

[[exceptions]]
check = "CH020-direct_exit"
path = "scripts/send_cmd.py"
item = "main"
classification = "by_design"
justification = "sys.exit() in main() of a CLI entry-point script is correct Python; send_cmd.py is not a library"

[[exceptions]]
check = "CH020-direct_exit"
path = "shokz_config.py"
item = "main"
classification = "by_design"
justification = "sys.exit() in main() after catching ShokzError is the intended pattern — shokz_config.py is a CLI entry point, not a library"

[[exceptions]]
check = "CH017-conditional_wrapper"
path = "shokz_config.py"
item = "_as_int"
classification = "by_design"
justification = "_as_int() is a type-coercion normaliser for YAML values; the isinstance guard IS its purpose — moving it to all call sites would duplicate type-narrowing logic everywhere"

[[exceptions]]
check = "IF001-linter_configuration"
path = ".pre-commit-config.yaml"
item = "ruff-check hook"
classification = "by_design"
justification = "ruff hooks use stages: [pre-commit] which is correct; Gourmand does not recognise the YAML list format for the stages field"

[[exceptions]]
check = "IF001-linter_configuration"
path = "pyproject.toml"
item = "ruff::C901"
classification = "by_design"
justification = "C901 is configured via [tool.ruff.lint.mccabe] max-complexity = 15; the gate is active at threshold 15, not the bare C901 default of 10"

# UI files: PyGObject requires gi.require_version() before gi.repository imports,
# which ruff flags as E402. These # noqa: E402 comments are the canonical pattern
# for all PyGObject applications.
[[exceptions]]
check = "lint_suppression"
path = "ui/**/*.py"
classification = "by_design"
justification = "PyGObject requires gi.require_version() before gi.repository imports, producing unavoidable E402 violations. # noqa: E402 is the canonical PyGObject pattern."

[[exceptions]]
check = "lint_suppression"
path = "openshokz_app.py"
classification = "by_design"
justification = "Same as ui/: gi.require_version() before imports, and subsequent project imports trigger E402."

# gi (PyGObject/GTK) has no type stubs; type: ignore is required for GObject subclassing
# and untyped gi.repository API calls.
[[exceptions]]
check = "random_scripts"
path = "openshokz_app.py"
classification = "by_design"
justification = "openshokz_app.py is the GTK4/Adwaita GUI entry point for the project, listed as openshokz-app in pyproject.toml [project.scripts]."

# GTK layout margins in edit_preset_page.py use GNOME HIG standard values (12, 24px).
# Naming every margin constant would add noise without improving readability.
[[exceptions]]
check = "primitive_obsession"
path = "ui/edit_preset_page.py"
classification = "by_design"
justification = "12px and 24px are GNOME HIG standard content margins. Naming each margin constant would obscure rather than clarify intent."

# Slider width 160px in edit_preset_page is a minimum comfortable touch target.
[[exceptions]]
check = "primitive_obsession"
path = "ui/edit_preset_page.py"
item = "__init__"
classification = "by_design"
justification = "160px is the minimum usable slider width on a GTK4 preferences page. Not a semantic constant."

# GTK signal callbacks must have the correct arity; unused _ parameters are required.
[[exceptions]]
check = "dead_code_markers"
path = "ui/eq_section.py"
item = "EqSection::_on_chip_toggled::_preset"
classification = "by_design"
justification = "GTK signal callback arity is fixed; _preset is required by the connect() call signature."

[[exceptions]]
check = "dead_code_markers"
path = "ui/language_section.py"
classification = "by_design"
justification = "GTK DragSource/DropTarget signal callbacks require all position parameters (_x, _y, _source, _target) even when unused."

